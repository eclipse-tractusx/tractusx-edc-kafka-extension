---
name: "Trivy"

permissions:
  contents: read
  security-events: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [ "Publish Artefacts" ]
    branches:
      - main
      - releases
      - release/*
      - hotfix/*
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    types:
      - completed

jobs:
  scan-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-java

      - name: Build fat-JAR
        working-directory: poc
        run: ./gradlew shadowJar --no-daemon

      - name: Build docker image
        working-directory: poc
        run: |
          cp resources/Dockerfile runtimes/edc/edc-controlplane-kafka
          docker build -t local-image:${{ github.sha }} runtimes/edc/edc-controlplane-kafka

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: local-image:${{ github.sha }}
          format: sarif
          output: trivy-results-${{ github.sha }}.sarif
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: success() && steps.imageCheck.outcome != 'failure'
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: "trivy-results-${{ github.sha }}.sarif"